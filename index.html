<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNS Attack Visualizer</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

    
    <div id="info">
        REAL-TIME DNS ATTACK VISUALIZATION
        <span id="attack-count" style="color:#ff4444; margin-left:20px;">0</span> ATTACKS
    </div>

    
    <div id="left-panel">
        <div class="panel-title">⬤ LIVE ATTACKS</div>
        <div id="recent-list">
            <div class="attack-item sev-low">
                <span class="sev-dot"></span>
                <div>
                    <div class="attack-route">Connecting...</div>
                    <div class="attack-meta">Waiting for data</div>
                </div>
            </div>
        </div>

        <div class="panel-title" style="margin-top:14px;">TOP SOURCES</div>
        <div id="top-sources">
            <div class="top-item"><span>—</span><span class="top-count">0</span></div>
        </div>
    </div>

    
     
<div id="legend">
    <div class="legend-item">
        <span class="legend-dot" style="background:#00ff88"></span>
        Source (Attacker)
    </div>
    <div class="legend-item">
        <span class="legend-dot" style="background:#ff0055"></span>
        Critical
    </div>
    <div class="legend-item">
        <span class="legend-dot" style="background:#ff4400"></span>
        High
    </div>
    <div class="legend-item">
        <span class="legend-dot" style="background:#ffaa00"></span>
        Medium
    </div>
    <div class="legend-item">
        <span class="legend-dot" style="background:#00ccff"></span>
        Low
    </div>
</div>
    <div id="debug">Loading...</div>

    <script type="module" src="main.js"></script>
</body>
</html>
